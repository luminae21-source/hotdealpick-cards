<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>핫딜픽 성에제거제 6종 판매가 표</title><desc>사용자 첨부 시안의 2026년 11월 11일 18시 가격 자료를 재구성한 디자인. 가격 재확인 전.</desc><style>text{font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif;font-kerning:normal;letter-spacing:-.6px}</style><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F8FAF7" stroke="none"/><text x="64" y="34" font-size="22" font-weight="400" fill="#647B7A" text-anchor="start" >이 포스팅은 쿠팡 파트너스 활동의 일환으로,</text><text x="64" y="64" font-size="22" font-weight="400" fill="#647B7A" text-anchor="start" >이에 따른 일정액의 수수료를 제공받습니다.</text><line x1="64" y1="87" x2="1016" y2="87" stroke="#D8E4DF" stroke-width="1"/><rect x="64" y="111" width="44" height="46" rx="12" fill="#F33430" stroke="none"/><text x="86" y="145" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" >딜</text><text x="122" y="145" font-size="29" font-weight="700" fill="#223845" text-anchor="start" >핫딜픽</text><text x="1016" y="143" font-size="22" font-weight="400" fill="#426765" text-anchor="end" >03 / 04</text><text x="64" y="219" font-size="23" font-weight="500" fill="#426765" text-anchor="start" >PRICE LIST  /  표시 판매가 함께 보기</text><text x="64" y="300" font-size="64" font-weight="700" fill="#223845" text-anchor="start" >살 때 내는 가격도</text><text x="64" y="379" font-size="64" font-weight="700" fill="#426765" text-anchor="start" >함께 확인하세요.</text><text x="64" y="432" font-size="26" font-weight="400" fill="#647B7A" text-anchor="start" >묶음 수량과 회원·쿠폰 조건까지 같은 줄에 담았어요.</text><rect x="64" y="475" width="952" height="715" rx="24" fill="#FFFFFF" stroke="#D8E4DF"/><rect x="65" y="476" width="950" height="59" rx="22" fill="#E8F4F1" stroke="none"/><rect x="65" y="505" width="950" height="30" rx="0" fill="#E8F4F1" stroke="none"/><text x="92" y="514" font-size="23" font-weight="500" fill="#426765" text-anchor="start" >순</text><text x="147" y="514" font-size="23" font-weight="500" fill="#426765" text-anchor="start" >상품 · 구성</text><text x="792" y="514" font-size="23" font-weight="500" fill="#426765" text-anchor="end" >판매가</text><text x="990" y="514" font-size="23" font-weight="500" fill="#426765" text-anchor="end" >100mL당</text><rect x="65" y="535" width="950" height="109" rx="0" fill="#F0F7F3" stroke="none"/><text x="100" y="584" font-size="23" font-weight="400" fill="#647B7A" text-anchor="middle" >01</text><text x="147" y="580" font-size="30" font-weight="500" fill="#223845" text-anchor="start" >동케 성에제거 스프레이</text><text x="147" y="616" font-size="22" font-weight="400" fill="#647B7A" text-anchor="start" >420mL × 2통</text><text x="792" y="590" font-size="40" font-weight="500" fill="#223845" text-anchor="end" >6,640원</text><text x="990" y="590" font-size="40" font-weight="700" fill="#F33430" text-anchor="end" >790원</text><rect x="65" y="644" width="950" height="109" rx="0" fill="#F0F7F3" stroke="none"/><line x1="84" y1="644" x2="996" y2="644" stroke="#D8E4DF" stroke-width="1"/><text x="100" y="693" font-size="23" font-weight="400" fill="#647B7A" text-anchor="middle" >02</text><text x="147" y="689" font-size="30" font-weight="500" fill="#223845" text-anchor="start" >지엔 성에싹</text><text x="147" y="725" font-size="22" font-weight="400" fill="#647B7A" text-anchor="start" >420mL × 2통  ·  와우·쿠폰가</text><text x="792" y="699" font-size="40" font-weight="500" fill="#223845" text-anchor="end" >7,870원</text><text x="990" y="699" font-size="40" font-weight="700" fill="#426765" text-anchor="end" >937원</text><rect x="65" y="753" width="950" height="109" rx="0" fill="#F0F7F3" stroke="none"/><line x1="84" y1="753" x2="996" y2="753" stroke="#D8E4DF" stroke-width="1"/><text x="100" y="802" font-size="23" font-weight="400" fill="#647B7A" text-anchor="middle" >03</text><text x="147" y="798" font-size="30" font-weight="500" fill="#223845" text-anchor="start" >탐사 성에제거 스프레이</text><text x="147" y="834" font-size="22" font-weight="400" fill="#647B7A" text-anchor="start" >420mL × 2통</text><text x="792" y="808" 