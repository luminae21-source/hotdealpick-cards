name: Validate, render and publish Hotdealpick

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'PNG / test artifact retention (days)'
        type: choice
        options: ['30', '60', '90']
        default: '30'

permissions:
  contents: read

concurrency:
  group: cards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate product JSON
        run: npm run validate
      - name: Run validation and pipeline tests
        run: npm test
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test real browser rendering
        run: npm run test:browser
      - name: Render 1080 x 1350 PNG cards
        run: npm run render
      - name: Build public site
        run: npm run build
      - name: Save PNG files and render report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hotdealpick-cards-${{ github.run_number }}
          path: rendered/
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days || '30' }}
      - name: Save browser test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: hotdealpick-tests-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention_days || '30' }}
      - name: Configure Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
